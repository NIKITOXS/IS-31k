<!DOCTYPE html>
<html>
<head>
    <title>Редактировать задачу</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: lightgray;}
        h1 { color: blue; }
        input, button { padding: 8px; margin: 5px; }
        .message { color: red; font-weight: bold; }
        .card { background-color: white; padding: 20px; border-radius: 5px; width: fit-content; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Редактирование задачи</h1>
        
        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}
        
        <form method="POST">
            <input type="text" name="task" value="{{ task.text }}" required>
            <button type="submit" style="background-color: #2ecc71; color: white; border: none; border-radius: 3px;">Сохранить</button>
            <a href="/" style="margin-left: 10px; text-decoration: none;">Отмена</a>
        </form>
    </div>
</body>
</html>
